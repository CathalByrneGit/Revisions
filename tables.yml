# CSO tables to track.
#
# Each entry is a PxStat matrix code. The pipeline fetches it as JSON-stat 2.0
# from the CSO API, and every time CSO publishes a new version it becomes a
# commit (and a tag) in data/cso.doltlite.
#
# To track another table, add an entry here. Find codes at
# https://data.cso.ie (the code is shown on each table's page).
#
# CSO replaces a table when it rebases an index (RSM05 base 2015 became RSM08
# base 2021), and the old one simply stops updating. If a table's latest
# release on the site is months old, look for its successor. Tables removed
# from this list keep their history in data/cso.doltlite but drop off the site.

tables:
  - id: MUM01
    title: Monthly unemployment
    why: >
      Seasonally adjusted series are re-estimated every month, so recent
      months are revised regularly. A good first test of the pipeline.

  - id: NAQ03
    title: GDP and GNP (quarterly)
    why: >
      Quarterly national accounts are published as preliminary estimates and
      revised as fuller data arrives, so early growth figures can move a lot.

  - id: EHQ03
    title: Earnings, hours and labour costs
    why: >
      EHECS publishes a preliminary estimate for the latest quarter and a
      final one for the quarter before, so each release revises the last.

  - id: RSM08
    title: Retail sales index
    why: >
      Monthly retail sales are revised as late survey returns come in and
      seasonal factors are re-estimated.

  - id: HPM09
    title: Residential property price index
    why: >
      Built from stamp duty filings, which can arrive months after a sale,
      so recent index values are revised as late transactions are added.

  - id: CPM24
    title: Consumer price index
    why: >
      CPI is almost never revised, which makes it the control: any change
      here would be unusual and worth a closer look.
